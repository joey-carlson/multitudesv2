# Multitudes runs local-first on a self-contained SQLite file by default and
# needs NO services. This compose file is OPTIONAL — use it only if you want to
# run a self-hosted PostgreSQL sync server (set DATABASE_URL to point at it).

services:
  # PostgreSQL - optional backend for a self-hosted sync server
  postgres:
    image: postgres:15-alpine
    container_name: multitudes-postgres
    environment:
      POSTGRES_USER: multitudes
      POSTGRES_PASSWORD: multitudes_dev_password
      POSTGRES_DB: multitudes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multitudes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: multitudes-network
